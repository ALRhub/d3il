_target_: agents.ebm_torch_agent.EBM_Torch_Agent
_recursive_: false

# ---------------------------------------------------------------------------
# Phase 1: unconditional generative flow-matching model (DiT backbone).
# Phase 2 reuses the SAME policy/framework block so the trained phase-1
# weights inject cleanly; phase 2 additionally trains the EBM + state encoder.
# ---------------------------------------------------------------------------

phase1:
  _target_: agents.models.ebm_jax.config.EBMPolicyConfig
  static_obs_shape: [3, 8, 8]      # unused (state-only); kept for dataclass
  gripper_obs_shape: [3, 8, 8]     # unused (state-only)
  action_dim: ${action_dim}
  policy_length: ${window_size}
  obs_length: ${window_size}
  phase: generative
  policy:
    _target_: agents.models.ebm_jax.config.DiTConfig
    input_dim: ${action_dim}
    cond_step: 0
    horizon: ${window_size}
    d_model: 128
    nhead: 8
    n_layers: 16
    mlp_ratio: 4.0
    use_cross_attention: false
    learn_sigma: false
    time_emb:
      _target_: agents.models.ebm_jax.config.PosEmbConfig
      vector: 128
      scale: 1.0
    cond_cfg:
      _target_: ml_networks.MLPConfig
      hidden_dim: 128
      output_activation: Identity
      n_layers: 1
      linear_cfg:
        _target_: ml_networks.LinearConfig
        activation: Mish
  framework_cfg:
    _target_: agents.models.ebm_jax.config.FlowMatchingConfig
    sigma: 0.1
    is_stable: false
    num_inference_steps: 10
  ot_method: exact
  sinkhorn_epsilon: 0.01
  ema:
    decay: 0.999
  optimizer_cfg:
    name: AdaBelief
    lr: 0.0006
    amsgrad: true

phase2:
  _target_: agents.models.ebm_jax.config.EBMPolicyConfig
  static_obs_shape: [3, 8, 8]
  gripper_obs_shape: [3, 8, 8]
  action_dim: ${action_dim}
  policy_length: ${window_size}
  obs_length: ${window_size}
  phase: ebm
  # same generative backbone as phase 1
  policy:
    _target_: agents.models.ebm_jax.config.DiTConfig
    input_dim: ${action_dim}
    cond_step: 0
    horizon: ${window_size}
    d_model: 128
    nhead: 8
    n_layers: 16
    mlp_ratio: 4.0
    use_cross_attention: false
    learn_sigma: false
    time_emb:
      _target_: agents.models.ebm_jax.config.PosEmbConfig
      vector: 128
      scale: 1.0
    cond_cfg:
      _target_: ml_networks.MLPConfig
      hidden_dim: 128
      output_activation: Identity
      n_layers: 1
      linear_cfg:
        _target_: ml_networks.LinearConfig
        activation: Mish
  framework_cfg:
    _target_: agents.models.ebm_jax.config.FlowMatchingConfig
    sigma: 0.1
    is_stable: false
    num_inference_steps: 10
  ot_method: exact
  sinkhorn_epsilon: 0.01
  ema:
    decay: 0.999
  # --- EBM ---
  ebm:
    _target_: agents.models.ebm_jax.config.EBMConfig
    # Transformer EBM over the obs/action sequence (best vapo setting).
    # Auto-downgraded to "mlp" by the agent when window_size==1 (single-step:
    # a transformer over length-1 sequences is unnecessary).
    arch: transformer
    pos_emb_on_qk: true
    hidden_dim: 256
    n_layers: 4
    nhead: 8
    mlp_ratio: 4.0
    num_samples_k: 32
    temperature: 0.5
    inference_num_samples: 128
    use_langevin: true
    langevin_steps: 10
    langevin_step_size: 0.2
    ema_decay: 0.999
    loss_type: infonce
    infonce_num_negatives: 31
    infonce_use_inbatch_inverted: true
    infonce_negative_source: random
    infonce_negative_warmup_steps: 1000
    invert_num_steps: 20
    optimizer_cfg:
      name: AdaBelief
      lr: 0.0002
      amsgrad: true
  # --- State ("pos") encoder: the D3IL observation conditions the EBM ---
  pos_input_dim: ${obs_dim}
  pos_obs_dim: 64
  pos_encoder:
    _target_: ml_networks.MLPConfig
    hidden_dim: 128
    output_activation: Mish
    n_layers: 1
    linear_cfg:
      _target_: ml_networks.LinearConfig
      activation: Mish

# ---------------------------------------------------------------------------
# Training / data
# ---------------------------------------------------------------------------
window_size: ${window_size}
# Split of the total epoch budget between the two phases (null => half/half).
phase1_epochs: null
phase2_epochs: null

trainset: ${trainset}
valset: ${valset}

train_batch_size: ${train_batch_size}
val_batch_size: ${val_batch_size}
num_workers: ${num_workers}
epoch: ${epoch}
device: ${device}
scale_data: ${scale_data}
eval_every_n_epochs: ${eval_every_n_epochs}
